[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kavp"
version = "0.1.1"
description = "Policy-aware and governance-aware federated AI research framework"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "KAVP Contributors", email = "mzu250004272@mzu.edu.in"},
]
maintainers = [
    {name = "KAVP Contributors", email = "mzu250004272@mzu.edu.in"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.0",
    "networkx>=3.1",
    "numpy>=1.24",
]

[project.optional-dependencies]
ml = [
    "torch>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.11",
]
viz = [
    "streamlit>=1.28",
    "pyvis>=0.3.2",
    "plotly>=5.18",
    "pandas>=2.0",
    "rich>=13.0",
]
dev = [
    "build>=1.0",
    "twine>=5.0",
    "pytest>=8.0",
]

[project.scripts]
kavp = "kavp.cli:main"

[project.urls]
Homepage = "https://github.com/Srimzuphd/kavp"
Repository = "https://github.com/Srimzuphd/kavp"
Issues = "https://github.com/Srimzuphd/kavp/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kavp = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
